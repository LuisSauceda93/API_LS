services:
  postgres:
    image: 'postgres:17'
    restart: unless-stopped
    environment:
      - 'POSTGRES_DB=lscontrolDB'
      - 'POSTGRES_PASSWORD=LsControl2026'
      - 'POSTGRES_USER=lasp'
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lasp -d lscontrolDB']
      interval: 10s
      timeout: 5s
      retries: 5

  jaeger:
    image: 'jaegertracing/jaeger:2.21.0'
    restart: unless-stopped
    ports:
      - '16686:16686'

  otel-collector:
    image: 'otel/opentelemetry-collector:0.161.0'
    restart: unless-stopped
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - './otel-collector-config.yaml:/etc/otelcol/config.yaml:ro'
    ports:
      - '4317:4317'
      - '4318:4318'
    depends_on:
      - jaeger

  api:
    image: 'luissauceda93/api-ls:latest'
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lscontrolDB
      SPRING_DATASOURCE_USERNAME: lasp
      SPRING_DATASOURCE_PASSWORD: LsControl2026
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_DOCKER_COMPOSE_ENABLED: 'false'
      OTEL_SERVICE_NAME: api-ls
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=docker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

volumes:
  pgdata:
