services:
  postgres:
    image: 'postgres:latest'
    restart: unless-stopped
    environment:
      - 'POSTGRES_DB=lscontrolDB'
      - 'POSTGRES_PASSWORD=LsControl2026'
      - 'POSTGRES_USER=lasp'
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
